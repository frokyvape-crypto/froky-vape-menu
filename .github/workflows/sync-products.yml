name: Cafe24 product sync

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync-products.yml"
      - ".github/scripts/sync_cafe24_products.py"
  workflow_dispatch:

concurrency:
  group: cafe24-token-rotation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets before rotating token
        run: |
          missing=0
          for name in CAFE24_CLIENT_ID CAFE24_CLIENT_SECRET CAFE24_REFRESH_TOKEN GH_ACTIONS_SECRET_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "No Cafe24 token was consumed because required secrets are missing."
            exit 1
          fi

          if ! gh api "repos/${REPO}/actions/secrets/public-key" >/dev/null; then
            echo "::error::GH_ACTIONS_SECRET_TOKEN cannot access repository Actions secrets."
            echo "No Cafe24 token was consumed because GitHub secret update permission is not ready."
            exit 1
          fi
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          GH_ACTIONS_SECRET_TOKEN: ${{ secrets.GH_ACTIONS_SECRET_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ACTIONS_SECRET_TOKEN }}
          REPO: ${{ github.repository }}

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rotate Cafe24 refresh token
        id: cafe24_token
        shell: bash
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ACTIONS_SECRET_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status=$(curl -sS -o "$response_file" -w "%{http_code}" -X POST \
            "https://frokyvape.cafe24api.com/api/v2/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${CAFE24_CLIENT_ID}:${CAFE24_CLIENT_SECRET}" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=${CAFE24_REFRESH_TOKEN}")

          if [ "$status" != "200" ]; then
            echo "::error::Cafe24 token refresh failed with HTTP $status"
            python3 - <<'PY' "$response_file"
          import json, sys
          try:
              data = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("Could not parse Cafe24 error response.")
              raise SystemExit(0)
          print("Cafe24 error:", data.get("error", "unknown"))
          print("Description:", data.get("error_description", data.get("message", "none")))
          PY
            exit 1
          fi

          access_token=$(python3 - <<'PY' "$response_file"
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data.get("access_token", ""))
          PY
          )
          new_refresh_token=$(python3 - <<'PY' "$response_file"
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(data.get("refresh_token", ""))
          PY
          )

          if [ -z "$access_token" ] || [ -z "$new_refresh_token" ]; then
            echo "::error::Cafe24 did not return both access_token and refresh_token."
            exit 1
          fi

          echo "::add-mask::$access_token"
          echo "::add-mask::$new_refresh_token"

          gh secret set CAFE24_REFRESH_TOKEN --repo "$REPO" --body "$new_refresh_token"
          echo "Cafe24 refresh token secret updated."
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Fetch Cafe24 products
        env:
          ACCESS_TOKEN: ${{ steps.cafe24_token.outputs.access_token }}
        run: |
          python3 -m pip install requests -q
          python3 .github/scripts/sync_cafe24_products.py

      - name: Commit and push products
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --staged --quiet; then
            echo "No product changes to commit."
          else
            git commit -m "chore: sync Cafe24 products $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push origin HEAD:main
          fi
