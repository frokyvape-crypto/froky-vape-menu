name: "새 Refresh Token 발급"

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/get-new-token.yml"]

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: 인증 코드로 토큰 교환
        run: |
          echo "🔄 카페24 API에 토큰 요청 중..."
          RESPONSE=$(curl -s -X POST \
            "https://frokyvape.cafe24api.com/api/v2/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.CAFE24_CLIENT_ID }}:${{ secrets.CAFE24_CLIENT_SECRET }}" \
            -d "grant_type=authorization_code&code=guADZUZeda5FZIjKz39lTD&redirect_uri=https://frokyvape-crypto.github.io/froky-vape-menu/callback.html")

          echo "📦 응답: $RESPONSE"

          REFRESH_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('refresh_token','ERROR'))")

          echo ""
          echo "================================================="
          echo "✅ REFRESH TOKEN"
          echo "Secret 이름: CAFE24_REFRESH_TOKEN"
          echo "Secret 값:   $REFRESH_TOKEN"
          echo "================================================="
