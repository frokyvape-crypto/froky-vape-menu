name: "카페24 토큰 즉시 교환"

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/get-token-now.yml"]

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: 토큰 교환
        run: |
          echo "🔄 카페24 토큰 교환 시작..."
          RESPONSE=$(curl -s -X POST \
            "https://frokyvape.cafe24api.com/api/v2/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.CAFE24_CLIENT_ID }}:${{ secrets.CAFE24_CLIENT_SECRET }}" \
            -d "grant_type=authorization_code&code=of1077ywNC1XTvvLD3IUvG&redirect_uri=https://frokyvape-crypto.github.io/froky-vape-menu/callback.html")

          echo "📦 응답: $RESPONSE"

          REFRESH_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('refresh_token','ERROR'))")
          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','없음'))")

          echo ""
          echo "================================================="
          echo "✅ REFRESH TOKEN (아래 값을 GitHub Secret에 저장)"
          echo "Secret 이름: CAFE24_REFRESH_TOKEN"
          echo "Secret 값:   $REFRESH_TOKEN"
          echo "================================================="
