name: "카페24 상품 즉시 동기화"

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/sync-now.yml"]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 액세스 토큰 발급
        id: token
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://frokyvape.cafe24api.com/api/v2/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -u "${{ secrets.CAFE24_CLIENT_ID }}:${{ secrets.CAFE24_CLIENT_SECRET }}" \
            -d "grant_type=refresh_token&refresh_token=${{ secrets.CAFE24_REFRESH_TOKEN }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token','ERROR'))")

          if [ "$ACCESS_TOKEN" = "ERROR" ]; then
            echo "❌ 액세스 토큰 발급 실패 - Refresh Token이 만료되었을 수 있습니다"
            echo "응답: $RESPONSE"
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: 카페24 상품 수집 (옵션 포함)
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          pip install requests -q
          python3 << 'PYEOF'
import requests, json, os, time

token = os.environ["ACCESS_TOKEN"]
headers = {
    "Authorization": f"Bearer {token}",
    "X-Cafe24-Api-Version": "2024-03-01",
}

# 1. 판매중+진열중 상품 전체 수집
all_products = []
offset = 0
while True:
    r = requests.get(
        "https://frokyvape.cafe24api.com/api/v2/products",
        headers=headers,
        params={"limit": 100, "offset": offset, "display": "T", "selling": "T"},
    )
    if r.status_code != 200:
        print(f"❌ API 오류: {r.status_code} - {r.text}")
        break
    items = r.json().get("products", [])
    if not items:
        break
    all_products.extend(items)
    print(f"  📦 {len(all_products)}개 수집 중...")
    if len(items) < 100:
        break
    offset += 100

print(f"✅ 총 {len(all_products)}개 상품")

# 카테고리 분류
CAT_KEYWORDS = {
    "폐호흡": ["폐호흡", "모드", "RDA", "RTA", "서브옴"],
    "고농도":  ["솔트", "salt", "Salt", "고농도", "SALT"],
    "일회용":  ["일회용", "디스포", "Disposable", "disposable"],
    "best":    ["베스트", "신상", "인기"],
}

def get_cat(name, tags):
    combined = name + " " + " ".join(tags or [])
    for cat, keywords in CAT_KEYWORDS.items():
        if any(k in combined for k in keywords):
            return cat
    return "입호흡"

result = []
for p in all_products:
    # 이미지 URL 정규화
    img = p.get("list_image") or p.get("detail_image") or p.get("tiny_image") or ""
    if img and img.startswith("/"):
        img = f"https://frokyvape.cafe24.com{img}"

    name = p.get("product_name", "")
    pno = p["product_no"]

    # 옵션 수집
    options = []
    if p.get("has_option") == "T":
        time.sleep(0.1)  # API rate limit 방지
        opt_r = requests.get(
            f"https://frokyvape.cafe24api.com/api/v2/products/{pno}/options",
            headers=headers,
        )
        if opt_r.status_code == 200:
            for opt_group in opt_r.json().get("options", []):
                for val in opt_group.get("option_value", []):
                    v = val.get("option_text", "").strip()
                    if v and v not in options:
                        options.append(v)

    cat = get_cat(name, p.get("tags", []))
    sale = bool(p.get("price_content"))

    result.append({
        "id":      pno,
        "name":    name,
        "price":   int(float(p.get("price", 0))),
        "img":     img,
        "flavor":  (p.get("summary_description") or "").strip(),
        "cat":     cat,
        "sale":    sale,
        "options": options,
    })
    print(f"  ✔ [{cat}] {name} - {int(float(p.get('price',0))):,}원  옵션:{options}")

with open("products.json", "w", encoding="utf-8") as f:
    json.dump(result, f, ensure_ascii=False, indent=2)

print(f"\n🎉 products.json 완료 ({len(result)}개)")
PYEOF

      - name: 커밋 & 푸시
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --staged --quiet; then
            echo "ℹ️ 변경사항 없음"
          else
            git commit -m "chore: 카페24 상품 동기화 $(date '+%Y-%m-%d %H:%M KST')"
            git push
            echo "✅ products.json 업데이트 완료"
          fi
