  <text x="1000" y="212" text-anchor="middle" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="800">
    <tspan fill="#000">본 제품은 담배사업법 시행 이전에 </tspan>
    <tspan fill="#f00">제조 또는 수입 신고된 제품</tspan>
    <tspan fill="#000">으로 소비자기본법에 따라 고지합니다.</tspan>
